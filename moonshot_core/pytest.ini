# pytest.ini
[pytest]
pythonpath = .
testpaths = tests
addopts = -m "not slow"
markers =
    live_openai: calls the real OpenAI HTTP API (requires OPENAI_API_KEY; opt-in). Run with: cd moonshot_core && pytest -o addopts= -m live_openai tests/...
    integration: integration tests (may be slower)
    slow: long-running tests (real connectors, full workflows; excluded by default). Run with: cd moonshot_core && pytest -o addopts= -m slow tests/...
