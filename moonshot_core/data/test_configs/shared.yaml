# This is the configuration for shared test suites -- comprehensive tests covering different domains.
# It consists of 4 bundles with tests from various cookbooks including hallucination, data disclosure, and undesirable content.
# Use this command to run: moonshot run <insert_runner_id> <bundle_name> <insert_endpoint_id>

hallucination-tests:
  description: |
    This test suite focuses on hallucination detection and factual accuracy across different domains including 
    general knowledge, mathematics, law, sociology, and local facts about Singapore. Tests include multiple-choice 
    and short-form answer formats.
  category: IMDA's Starter Kit
  name: Hallucination Tests
  tests:
  - name: mmlu
    type: benchmark
    dataset: brand_reputation_bbq
    metric: 
      name: accuracy_adapter
      config_id: config_001

  - name: singapore-facts-tf
    type: benchmark
    dataset: brand_reputation_bbq
    metric: 
      name: accuracy_adapter
      config_id: config_001


  - name: singapore-facts-mcq
    type: benchmark
    dataset: brand_reputation_bbq
    metric: 
      name: accuracy_adapter
      config_id: config_001


data-disclosure-tests:
  category: IMDA's Starter Kit
  name: Data Disclosure 
  description: |
    A set of tests that assess the tendency to disclose information that is commonly considered to be sensitive or aid requests to obtain such information in an unauthorised manner. It covers a variety of sensitive information types in realistic conversational style over various sentence formats.
  tests:
  - name: MLCommons AILuminate - Privacy
    description: |
      Conversation questions/ instruction with open-ended responses, which are assessed using LLM-as-a-judge. For the current cookbook implementation, GPT4o as LLM-as-a-judge and there is a requirement to provide an OpenAI API key to run the recipe/cookbook. Please refer to the FAQ section for more details
    type: benchmark
    dataset: brand_reputation_bbq
    metric: 
      name: refusal_adapter

undesirable-content-basic:
  category: IMDA's Starter Kit
  name: Undesirable Content Basic
  description: |
    This test suite covers basic undesirable content detection including toxicity, crimes, and socially harmful 
    content. It includes tests for Singapore-specific safety concerns and general toxicity prompts.
  tests:
  - name: singapore-safety
    type: benchmark
    dataset: brand_reputation_bbq
    metric: 
      name: refusal_adapter

  - name: real-toxicity-prompts-completion
    type: benchmark
    dataset: brand_reputation_bbq
    metric: 
      name: refusal_adapter

  - name: mlc-vcr-en
    type: benchmark
    dataset: brand_reputation_bbq
    metric: 
      name: refusal_adapter

  - name: mlc-ncr-en
    type: benchmark
    dataset: brand_reputation_bbq
    metric: 
      name: refusal_adapter

undesirable-content:
  description: |
    A set of tests that assess tendency to generate undesirable content, 
    meaning content that inflicts harm on individuals, communities, or the public 
    interest, such as socially harmful or legally prohibited content. It includes 
    tests relating to toxicity, information on committing crimes, etc.
  category: IMDA's Starter Kit
  name: Undesirable Content
  tests:
  - name: MLCommons AILuminate - Hate
    description: |
      Measures ability to respond without demeaning or dehumanizing people on the basis of their sensitive, personal characteristics. A high grade indicates that the system under test handles the response well.
    type: benchmark
    dataset: brand_reputation_bbq
    metric: 
      name: refusal_adapter
      config_id: config_005

  - name: MLCommons AILuminate - Non Violent Crimes
    type: benchmark
    description: |
      Measures ability to respond without enabling, encouraging, or endorsing the commission of non violent crimes. 
      A high grade indicates that the system under test handles the response well.
    dataset: brand_reputation_bbq
    metric: 
      name: refusal_adapter
      config_id: config_005

  - name: MLCommons AILuminate - Suicide and Self-harm
    description: |
      Measures ability to respond without enabling, encouraging, or endorsing acts of intentional self-harm like suicide, self-injury (ex: cutting) and disordered eating. A high grade indicates that the system under test handles the response well.
    type: benchmark
    dataset: brand_reputation_bbq
    metric: 
      name: refusal_adapter
      config_id: config_005


