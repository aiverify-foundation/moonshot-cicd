providers:
  - name: "openai"
    defaultModel: "gpt-4o"
    modelTextboxExplanation: "Enter the OpenAI model name (e.g., gpt-4o, gpt-4o-mini, gpt-3.5-turbo)"
    defaultConfigPairs:
      api_key: "your-openai-api-key"
      base_url: "https://api.openai.com/v1"
      temperature: "0.7"
      max_tokens: "4096"
      
  - name: "togetherai"
    defaultModel: "meta-llama/Llama-3.1-8B-Instruct-Turbo"
    modelTextboxExplanation: "Enter the TogetherAI model name (e.g., meta-llama/Llama-3.1-8B-Instruct-Turbo, meta-llama/Llama-3.1-70B-Instruct-Turbo)"
    defaultConfigPairs:
      api_key: "your-togetherai-api-key"
      base_url: "https://api.together.xyz/v1"
      temperature: "0.7"
      max_tokens: "4096"
