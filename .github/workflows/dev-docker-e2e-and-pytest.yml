name: Dev Docker + E2E + Pytest + Portal Jest

on:
  workflow_dispatch:

jobs:
  build-dev-docker:
    uses: ./.github/workflows/docker-build-dev-main.yaml
    permissions:
      id-token: write
      contents: read
      packages: write

  e2e-on-docker:
    needs: build-dev-docker
    uses: ./.github/workflows/e2e-docker-tests.yml
    with:
      moonshot_image: ${{ needs.build-dev-docker.outputs.moonshot_image }}
    permissions:
      contents: read
      packages: read

  pre-build-checks:
    uses: ./.github/workflows/v1-pre-build-checks-core.yml
    permissions:
      id-token: write
      contents: read

  portal-jest:
    uses: ./.github/workflows/portal-jest-tests.yml
    permissions:
      contents: read

  promote-to-staging:
    needs: [build-dev-docker, e2e-on-docker, pre-build-checks, portal-jest]
    uses: ./.github/workflows/moonshot-tag-docker-staging.yaml
    with:
      moonshot_dev_tag: ${{ needs.build-dev-docker.outputs.image_tag }}
    permissions:
      id-token: write
      contents: read
      packages: write
