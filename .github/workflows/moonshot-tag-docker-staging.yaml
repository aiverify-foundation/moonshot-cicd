name: Promote Moonshot Docker Image to STAGING

on:
  push:
    branches:
      - dev_main
  workflow_dispatch:
    inputs:
      moonshot_dev_tag:
        description: 'Existing tag of the moonshot-dev image to promote'
        required: true
        type: string

jobs:
  promote-moonshot-dev-to-staging:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest

    env:
      GHCR_REGISTRY: ghcr.io
      SOURCE_IMAGE_REPO: ghcr.io/aiverify-foundation/moonshot-dev

    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.GHCR_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Add staging tag to moonshot-dev image
      run: |
        STAGING_TAG = "staging-$(TZ=Asia/Singapore date +%Y%m%d_%H%M%S)"
        docker buildx imagetools create \
          --tag "${SOURCE_IMAGE_REPO}:${STAGING_TAG}" \
          "${SOURCE_IMAGE_REPO}:${{ inputs.moonshot_dev_tag }}"

