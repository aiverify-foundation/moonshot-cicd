name: dev_main Docker build and push

on:
  push:
    branches: [ "dev_main" ]
  workflow_dispatch:

jobs:
  dev-main-build-test-push:
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest

    env:
      GHCR_REGISTRY: ghcr.io
      GHCR_NAMESPACE: aiverify-foundation
      IMAGE_NAME_MS: moonshot
      IMAGE_NAME_PC: process_checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref_name }}

    # Tag format: dev_<build datetime in YYYYMMDD_HHMMSS>_<HEAD commit short SHA>
    # Example:     dev_20260903_031145_a1b2c3d
    - name: Set image tag
      run: |
        GIT_COMMIT="$(git rev-parse HEAD)"
        GIT_BRANCH="$(git branch --show-current)"
        GIT_BRANCH="${GIT_BRANCH:-${GITHUB_REF_NAME}}"
        IMAGE_TAG="dev_$(TZ=Asia/Singapore date +%Y%m%d_%H%M%S)_${GIT_COMMIT:0:7}"
        echo "GIT_COMMIT=${GIT_COMMIT}" >> "$GITHUB_ENV"
        echo "GIT_BRANCH=${GIT_BRANCH}" >> "$GITHUB_ENV"
        echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
        echo "Using image tag: ${IMAGE_TAG}"
        echo "Using git.commit: ${GIT_COMMIT}"
        echo "Using git.branch: ${GIT_BRANCH}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.GHCR_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # ---------- Moonshot ----------
    - name: Build Moonshot Docker image
      run: |
        docker build -f docker/moonshot.Dockerfile \
          -t moonshot:${{ env.IMAGE_TAG }} \
          --label git.commit=${{ env.GIT_COMMIT }} \
          --label git.branch=${{ env.GIT_BRANCH }} \
          --label build.source=github-actions \
          .

    - name: Push Moonshot Image to GitHub CR
      run: |
        docker login --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} ghcr.io
        docker tag moonshot:${{ env.IMAGE_TAG }} ghcr.io/${{ env.GHCR_NAMESPACE }}/moonshot-dev:${{ env.IMAGE_TAG }}
        docker push ghcr.io/${{ env.GHCR_NAMESPACE }}/moonshot-dev:${{ env.IMAGE_TAG }}

    # ---------- Process Checks ----------
    - name: Build and Push Process Checks (Multi-arch to GHCR)
      uses: docker/build-push-action@v5
      with:
        context: process_check_app
        file: process_check_app/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/${{ env.GHCR_NAMESPACE }}/process_checks:dev_main
