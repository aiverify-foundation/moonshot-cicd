name: dev_main Docker build and push

on:
  push:
    branches: [ "dev_main" ]
  workflow_dispatch:

jobs:
  dev-main-build-test-push:
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: dev_main
      GHCR_REGISTRY: ghcr.io
      GHCR_NAMESPACE: aiverify-foundation
      IMAGE_NAME_MS: moonshot
      IMAGE_NAME_PC: process_checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.GHCR_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # ---------- Moonshot ----------
    - name: Build Moonshot Docker image
      run: |
        docker build -t moonshot:dev_main -f moonshot_core/Dockerfile moonshot_core

    - name: Push Moonshot Image to GitHub CR
      run: |
        docker login --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} ghcr.io
        docker tag moonshot:dev_main ghcr.io/${{ env.GHCR_NAMESPACE }}/moonshot:${{ env.IMAGE_TAG }}
        docker push ghcr.io/${{ env.GHCR_NAMESPACE }}/moonshot:${{ env.IMAGE_TAG }}

    # ---------- Process Checks ----------
    - name: Build and Push Process Checks (Multi-arch to GHCR)
      uses: docker/build-push-action@v5
      with:
        context: process_check_app
        file: process_check_app/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/${{ env.GHCR_NAMESPACE }}/process_checks:${{ env.IMAGE_TAG }}
