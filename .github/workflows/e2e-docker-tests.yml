name: E2E Docker Tests

on:
  workflow_dispatch:
    inputs:
      moonshot_image:
        description: 'Optional Moonshot image (full ref or sha256:…). Empty = build from docker/moonshot.Dockerfile'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      moonshot_image:
        description: 'Optional Moonshot image (full ref or sha256:…). Empty = build from docker/moonshot.Dockerfile'
        required: false
        type: string
        default: ''

jobs:
  e2e-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.moonshot_image != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Playwright e2e via Docker Compose
        id: e2e
        env:
          MOONSHOT_IMAGE_INPUT: ${{ inputs.moonshot_image }}
        run: |
          COMPOSE=(docker compose -f docker/moonshot.e2e-test.docker-compose.yml)
          mkdir -p e2e-artifacts

          RAW="${MOONSHOT_IMAGE_INPUT:-}"
          RAW="$(echo "$RAW" | xargs)"  # trim whitespace

          if [ -z "$RAW" ]; then
            echo "moonshot-e2e-web source: BUILDING from docker/moonshot.Dockerfile (no moonshot_image input)"
            unset MOONSHOT_E2E_WEB_IMAGE
          elif [[ "$RAW" =~ ^sha256:[0-9a-fA-F]+$ ]]; then
            export MOONSHOT_E2E_WEB_IMAGE="ghcr.io/aiverify-foundation/moonshot-dev@${RAW}"
            echo "moonshot-e2e-web source: resolved bare digest to ${MOONSHOT_E2E_WEB_IMAGE}"
          else
            export MOONSHOT_E2E_WEB_IMAGE="$RAW"
          fi

          set +e

          if [ -n "${MOONSHOT_E2E_WEB_IMAGE:-}" ]; then
            echo "moonshot-e2e-web source: PULLING ${MOONSHOT_E2E_WEB_IMAGE}"
            if docker pull "${MOONSHOT_E2E_WEB_IMAGE}"; then
              DIGEST=$(docker image inspect --format='{{index .RepoDigests 0}}' "${MOONSHOT_E2E_WEB_IMAGE}" 2>/dev/null || true)
              if [ -n "$DIGEST" ]; then
                echo "moonshot-e2e-web source: PULL OK (${MOONSHOT_E2E_WEB_IMAGE}) digest=${DIGEST}"
              else
                echo "moonshot-e2e-web source: PULL OK (${MOONSHOT_E2E_WEB_IMAGE})"
              fi
            else
              echo "moonshot-e2e-web source: PULL FAILED (${MOONSHOT_E2E_WEB_IMAGE})"
              exit 1
            fi

            "${COMPOSE[@]}" build moonshot-e2e-testing
            BUILD_EXIT=$?
            if [ "$BUILD_EXIT" -ne 0 ]; then
              exit "$BUILD_EXIT"
            fi
          else
            "${COMPOSE[@]}" build
            BUILD_EXIT=$?
            if [ "$BUILD_EXIT" -ne 0 ]; then
              exit "$BUILD_EXIT"
            fi
            echo "moonshot-e2e-web source: BUILD OK (local image moonshot-cicd from Dockerfile)"
          fi

          # Run the one-shot volume init separately. If it shares
          # --abort-on-container-exit with web/testing, Compose aborts as soon
          # as init exits (code 0) and never runs Playwright.
          "${COMPOSE[@]}" run --rm --no-deps moonshot-e2e-volume-init
          INIT_EXIT=$?
          if [ "$INIT_EXIT" -ne 0 ]; then
            echo "Volume init failed with exit code $INIT_EXIT"
            "${COMPOSE[@]}" down -v || true
            exit "$INIT_EXIT"
          fi

          # --no-build: images are prepared above; avoids rebuilding a pulled digest.
          "${COMPOSE[@]}" up -d --no-deps --no-build moonshot-e2e-web
          WEB_UP_EXIT=$?
          if [ "$WEB_UP_EXIT" -ne 0 ]; then
            "${COMPOSE[@]}" logs moonshot-e2e-web || true
            "${COMPOSE[@]}" down -v || true
            exit "$WEB_UP_EXIT"
          fi

          # Healthcheck: interval 5s, retries 24, start_period 15s (~2+ min budget).
          STATUS=starting
          for _ in $(seq 1 48); do
            STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' moonshot-e2e-web 2>/dev/null || echo missing)
            if [ "$STATUS" = "healthy" ]; then
              break
            fi
            if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ] || [ "$STATUS" = "missing" ]; then
              echo "moonshot-e2e-web not healthy (status=$STATUS)"
              "${COMPOSE[@]}" logs moonshot-e2e-web || true
              "${COMPOSE[@]}" down -v || true
              exit 1
            fi
            sleep 5
          done
          if [ "$STATUS" != "healthy" ]; then
            echo "Timed out waiting for moonshot-e2e-web (status=$STATUS)"
            "${COMPOSE[@]}" logs moonshot-e2e-web || true
            "${COMPOSE[@]}" down -v || true
            exit 1
          fi

          "${COMPOSE[@]}" up --no-deps --no-build --abort-on-container-exit --exit-code-from moonshot-e2e-testing moonshot-e2e-testing
          TEST_EXIT=$?

          # Prefer the testing container's exit code when it exists.
          CONTAINER_EXIT=$(docker inspect -f '{{.State.ExitCode}}' moonshot-e2e-testing 2>/dev/null)
          if [ -n "$CONTAINER_EXIT" ]; then
            TEST_EXIT=$CONTAINER_EXIT
          fi

          docker cp moonshot-e2e-testing:/app/system_test/test-results e2e-artifacts/test-results || true
          docker cp moonshot-e2e-testing:/app/system_test/playwright-report e2e-artifacts/playwright-report || true

          RESULTS_JSON=e2e-artifacts/test-results/results.json
          if [ ! -f "$RESULTS_JSON" ]; then
            echo "Missing Playwright results.json — suite did not produce a report."
            TEST_EXIT=1
          else
            UNEXPECTED=$(python3 -c "import json,sys; s=json.load(open(sys.argv[1])).get('stats',{}); print(int(s.get('unexpected',0)))" "$RESULTS_JSON")
            if [ "$UNEXPECTED" -gt 0 ]; then
              echo "Playwright reported $UNEXPECTED unexpected (failed) test(s)."
              TEST_EXIT=1
            fi
          fi

          "${COMPOSE[@]}" down -v || true
          set -e

          exit "$TEST_EXIT"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-docker-${{ github.run_id }}
          path: e2e-artifacts/
          if-no-files-found: warn
