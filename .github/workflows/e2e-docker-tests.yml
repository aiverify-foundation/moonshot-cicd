name: E2E Docker Tests

on:
  workflow_dispatch:
  push:
    branches:
      - "dev_main"

jobs:
  e2e-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Playwright e2e via Docker Compose
        id: e2e
        run: |
          COMPOSE=(docker compose -f docker/moonshot.e2e-test.docker-compose.yml)
          mkdir -p e2e-artifacts

          set +e

          "${COMPOSE[@]}" build
          BUILD_EXIT=$?
          if [ "$BUILD_EXIT" -ne 0 ]; then
            exit "$BUILD_EXIT"
          fi

          # Run the one-shot volume init separately. If it shares
          # --abort-on-container-exit with web/testing, Compose aborts as soon
          # as init exits (code 0) and never runs Playwright.
          "${COMPOSE[@]}" run --rm --no-deps moonshot-e2e-volume-init
          INIT_EXIT=$?
          if [ "$INIT_EXIT" -ne 0 ]; then
            echo "Volume init failed with exit code $INIT_EXIT"
            "${COMPOSE[@]}" down -v || true
            exit "$INIT_EXIT"
          fi

          "${COMPOSE[@]}" up -d --no-deps moonshot-e2e-web
          WEB_UP_EXIT=$?
          if [ "$WEB_UP_EXIT" -ne 0 ]; then
            "${COMPOSE[@]}" logs moonshot-e2e-web || true
            "${COMPOSE[@]}" down -v || true
            exit "$WEB_UP_EXIT"
          fi

          # Healthcheck: interval 5s, retries 24, start_period 15s (~2+ min budget).
          STATUS=starting
          for _ in $(seq 1 48); do
            STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' moonshot-e2e-web 2>/dev/null || echo missing)
            if [ "$STATUS" = "healthy" ]; then
              break
            fi
            if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ] || [ "$STATUS" = "missing" ]; then
              echo "moonshot-e2e-web not healthy (status=$STATUS)"
              "${COMPOSE[@]}" logs moonshot-e2e-web || true
              "${COMPOSE[@]}" down -v || true
              exit 1
            fi
            sleep 5
          done
          if [ "$STATUS" != "healthy" ]; then
            echo "Timed out waiting for moonshot-e2e-web (status=$STATUS)"
            "${COMPOSE[@]}" logs moonshot-e2e-web || true
            "${COMPOSE[@]}" down -v || true
            exit 1
          fi

          "${COMPOSE[@]}" up --no-deps --abort-on-container-exit --exit-code-from moonshot-e2e-testing moonshot-e2e-testing
          TEST_EXIT=$?

          # Prefer the testing container's exit code when it exists.
          CONTAINER_EXIT=$(docker inspect -f '{{.State.ExitCode}}' moonshot-e2e-testing 2>/dev/null)
          if [ -n "$CONTAINER_EXIT" ]; then
            TEST_EXIT=$CONTAINER_EXIT
          fi

          docker cp moonshot-e2e-testing:/app/system_test/test-results e2e-artifacts/test-results || true
          docker cp moonshot-e2e-testing:/app/system_test/playwright-report e2e-artifacts/playwright-report || true

          RESULTS_JSON=e2e-artifacts/test-results/results.json
          if [ ! -f "$RESULTS_JSON" ]; then
            echo "Missing Playwright results.json — suite did not produce a report."
            TEST_EXIT=1
          else
            UNEXPECTED=$(python3 -c "import json,sys; s=json.load(open(sys.argv[1])).get('stats',{}); print(int(s.get('unexpected',0)))" "$RESULTS_JSON")
            if [ "$UNEXPECTED" -gt 0 ]; then
              echo "Playwright reported $UNEXPECTED unexpected (failed) test(s)."
              TEST_EXIT=1
            fi
          fi

          "${COMPOSE[@]}" down -v || true
          set -e

          exit "$TEST_EXIT"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-docker-${{ github.run_id }}
          path: e2e-artifacts/
          if-no-files-found: warn
