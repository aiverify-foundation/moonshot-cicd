# Persistent local hosting for Moonshot (install-test image).
# From repo root:
#   docker compose -f docker/moonshot.install-test.docker-compose.yml up --build
#
# All persistent data: Docker volume moonshot-data -> /var/lib/moonshot

services:
  moonshot:
    image: moonshot-install-test
    build:
      # Paths relative to this compose file's directory (docker/).
      # Context must be the repo root so COPY moonshot_core/ etc. work.
      context: ..
      dockerfile: docker/moonshot.install-test.Dockerfile
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - moonshot-data:/var/lib/moonshot
    environment:
      MOONSHOT_DB_PATH: /var/lib/moonshot/moonshot_install_test.db
      MOONSHOT_BENCHMARK_RESULTS_DIR: /var/lib/moonshot/results
      MOONSHOT_API_NO_RELOAD: "1"
    command: ["serve"]

volumes:
  moonshot-data:
