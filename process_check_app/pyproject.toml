[tool.poetry]
name = "process-check-app"
version = "1.1.0"
description = "This tool helps you assess and document the responsible AI practices you have implemented in deploying your Generative AI application, and generates a summary report."
authors = ["AI Verify Foundation <info@aiverify.sg>"]
readme = "README.md"
license = "Apache-2.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
streamlit = "^1.45.1"
openpyxl = "^3.1.5"
bleach = "^6.2.0"
reportlab = "^4.4.1"
matplotlib = "^3.10.3"
pydantic = "^2.11.5"
streamlit-scroll-to-top = "^0.0.4"

[tool.poetry.group.dev.dependencies]
anybadge = "^1.14.0"
black = "^24.8.0"
coverage = "^7.7.0"
flake8 = "^7.1.0"
isort = "^5.13.2"
poetry-plugin-export = "^1.8.0"
pre-commit = "^4.1.0"
pyinstrument = "^4.7.1"
pytest = "^8.3.4"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
pytest-html = "^4.1.1"
pytest-json = "^0.4.0"
pytest-mock = "^3.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
testing = ["pytest", "pyyaml", "pytest-benchmark", "coverage"]
